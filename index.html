<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>質數裂變：因數分解防衛戰 (Prime Split: Factorization Protocol)</title>
    <meta name="description" content="2D 質數蜂巢陣列射擊遊戲。發射 2~97 質數子彈進行因數分解、裂變彈跳、物理連鎖與公因數超導共鳴！">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="game-container-layout">
    <!-- Left Sidebar: Prime Selection Palette (2 ~ 97) with Q / W navigation -->
    <aside class="prime-sidebar">
        <div class="sidebar-header">
            <h3>⚡ 質數庫 (2~97)</h3>
            <div class="sidebar-nav-hint">
                <span><kbd>Q</kbd> ◄ 上一個</span>
                <span><kbd>W</kbd> 下一個 ►</span>
            </div>
        </div>
        <div id="prime-dock-tiers" class="sidebar-prime-list"></div>
    </aside>

    <!-- Center Main Game Area (Elevated directly to the top!) -->
    <div class="game-main-area">
        <!-- Canvas Play Area (Dual Arena in Versus Mode) -->
        <main id="canvas-container">
            <div class="arena-wrapper">
                <!-- Player Arena -->
                <div id="player-arena-box" class="arena-box player">
                    <canvas id="gameCanvas"></canvas>
                </div>

                <!-- Versus Divider & Real-time Combat Meter -->
                <div id="vs-arena-divider" class="vs-divider" style="display: none;">
                    <div class="vs-badge">VS</div>
                    <div id="vs-round-score" class="vs-score">0 : 0</div>
                    <div id="vs-sudden-death-timer" class="vs-timer" title="每 10 秒雙方強制增加一排！">⏱️ 10s</div>
                    <div id="vs-attack-msg" class="vs-alert"></div>
                </div>

                <!-- Computer AI Arena -->
                <div id="ai-arena-box" class="arena-box ai" style="display: none;">
                    <canvas id="aiCanvas"></canvas>
                </div>
            </div>

            <!-- Game Result Card (No Dark Mask, Full Battlefield Visibility) -->
            <div id="game-modal" class="game-modal">
                <div class="modal-content">
                    <h2 id="modal-title" class="modal-title">GAME OVER</h2>
                    <p id="modal-message" class="modal-message">防線遭到突破！</p>
                    <div class="modal-actions">
                        <button id="modal-btn-retry" class="btn-modal btn-modal-primary">再次挑戰</button>
                        <button id="modal-btn-toggle-view" class="btn-modal btn-modal-secondary" title="收合此卡片以看清全盤泡泡">👁️ 檢視盤面</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Right Sidebar: Title, Mode Selection & Real-time Stats Dashboard -->
    <aside class="game-dashboard-sidebar">
        <!-- Header & Title -->
        <header class="game-header">
            <div class="brand-title">
                <h1>PRIME SPLIT</h1>
                <span class="badge-prime">因數分解防衛戰</span>
            </div>

            <!-- Utility Buttons -->
            <div class="header-actions">
                <button id="btn-audio" class="btn-cyber" title="開關音效">🔊 音效</button>
                <button id="btn-restart" class="btn-cyber" title="重新開始本關">🔄 重開</button>
            </div>
        </header>

        <!-- Mode Select Tabs -->
        <div class="dashboard-block">
            <span class="dashboard-block-title">遊戲模式選擇</span>
            <nav class="mode-tabs" aria-label="Game Modes">
                <button class="mode-tab active" data-mode="arcade">無盡防守</button>
                <button class="mode-tab" data-mode="vs">對戰模式 (VS AI)</button>
            </nav>
        </div>

        <!-- Stats Bar (2x2 Grid) -->
        <div class="dashboard-block">
            <span class="dashboard-block-title">即時戰況數據</span>
            <section class="stats-bar">
                <div class="stat-item">
                    <span class="stat-label">STAGE 關卡</span>
                    <span id="stage-val" class="stat-value" style="color: #00ff88;">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">SCORE 當前積分</span>
                    <span id="score-val" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">HIGH 歷史最高</span>
                    <span id="high-score-val" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">COMBO 連擊</span>
                    <span id="combo-val" class="stat-value">x0</span>
                </div>
            </section>
        </div>

    </aside>
</div>

<!-- Game Scripts (ES Modules) -->
<script type="module" src="js/game.js"></script>

</body>
</html>
